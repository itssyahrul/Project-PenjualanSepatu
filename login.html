<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk - SoleSphere Shoe Store</title>
  <meta name="description" content="Masuk ke akun SoleSphere Anda untuk berbelanja sepatu premium terpopuler dari Nike, Adidas, Puma, Jordan, New Balance.">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="h-full bg-stone-50 bg-grid-pattern text-slate-800 flex flex-col justify-between min-h-screen">

  <!-- Navbar -->
  <header class="sticky top-0 z-40 w-full glass-nav border-b border-slate-100 transition-all">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <!-- Logo -->
      <a href="index.html" class="flex items-center gap-2 group">
        <div class="w-10 h-10 bg-emerald-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-emerald-500/30 group-hover:scale-105 transition-transform duration-300">
          <svg class="w-6 h-6 transform -rotate-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
        </div>
        <span class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-slate-900 to-slate-600 bg-clip-text text-transparent">Sole<span class="text-emerald-600">Sphere</span></span>
      </a>
      
      <!-- Back Home Link -->
      <a href="index.html" class="flex items-center gap-1 text-sm font-semibold text-slate-500 hover:text-emerald-700 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        Kembali ke Beranda
      </a>
    </div>
  </header>

  <!-- Login Form Section -->
  <main class="flex-grow flex items-center justify-center px-4 py-12 md:py-16">
    <div class="w-full max-w-md bg-white border border-slate-100 rounded-3xl p-8 shadow-2xl animate-fade-in-up relative overflow-hidden">
      <!-- Light orb decoration -->
      <div class="absolute -top-12 -right-12 w-32 h-32 bg-emerald-500/5 rounded-full blur-3xl"></div>
      <div class="absolute -bottom-12 -left-12 w-32 h-32 bg-emerald-500/5 rounded-full blur-3xl"></div>

      <div class="text-center mb-8 relative">
        <h1 class="text-3xl font-extrabold text-slate-900">Selamat Datang</h1>
        <p class="text-slate-500 text-sm mt-2">Masuk untuk menikmati belanja sepatu premium</p>
      </div>

      <form id="login-form" class="space-y-6 relative">
        <!-- Email Input -->
        <div class="space-y-2">
          <label for="email" class="block text-xs font-bold text-slate-400 uppercase tracking-wider">Email</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path></svg>
            </span>
            <input type="email" id="email" class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 rounded-xl text-slate-800 outline-none placeholder-slate-400 transition-all text-sm" placeholder="nama@contoh.com" required>
          </div>
        </div>

        <!-- Password Input -->
        <div class="space-y-2">
          <label for="password" class="block text-xs font-bold text-slate-400 uppercase tracking-wider">Kata Sandi</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </span>
            <input type="password" id="password" class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 rounded-xl text-slate-800 outline-none placeholder-slate-400 transition-all text-sm" placeholder="••••••••" required>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold rounded-xl transition-all shadow-lg shadow-emerald-600/20 text-sm tracking-wide">
          Masuk Sekarang
        </button>
      </form>

      <!-- Demo Account Box -->
      <div class="mt-6 p-4 rounded-xl bg-emerald-50/50 border border-emerald-100 text-xs text-emerald-800 space-y-1.5 font-medium">
        <p class="font-bold text-emerald-750 flex items-center gap-1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          Informasi Akun Demo Admin:
        </p>
        <p><strong>Email Admin:</strong> admin@solesphere.com</p>
        <p><strong>Password:</strong> admin123</p>
      </div>

      <!-- Register Link -->
      <div class="mt-6 text-center text-sm text-slate-500">
        Belum punya akun? 
        <a href="register.html" class="text-emerald-600 hover:text-emerald-700 font-bold hover:underline transition-all">Daftar</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="py-6 text-center text-slate-500 text-xs border-t border-slate-100">
    <p>&copy; 2026 SoleSphere. All rights reserved. Made for GitHub Pages.</p>
  </footer>

  <!-- Scripts -->
  <script src="js/products-data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
